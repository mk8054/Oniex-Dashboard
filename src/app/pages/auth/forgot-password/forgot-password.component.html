<div class="card">
  <div class="card-head">
    <div class="logo">
      <img src="./logo.svg" alt="Logo" />
    </div>
    <div class="spacer"></div>
    <div class="flex flex-col items-center">
      Resert Password
      <div class="subtitle mb-6">
        Enter your email address to reset your password
      </div>
    </div>
  </div>
  <div class="card-body">
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="mb-2">
        <div class="label-info">
          <label class="label" for="email">Email Id</label>
          <div
            *ngIf="
              forgotForm.get('email')?.invalid &&
              forgotForm.get('email')?.touched
            "
            class="error"
          >
            Please enter a valid email address.
          </div>
        </div>
        <input
          class="form-control"
          [ngClass]="{
            error:
              forgotForm.get('email')?.invalid &&
              forgotForm.get('email')?.touched
          }"
          id="email"
          type="text"
          placeholder="Enter your email"
          formControlName="email"
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="forgotForm.invalid">
        Reset Password
      </button>

      <div class="mt-4 mr-2 flex justify-end items-center">
        <a routerLink="/auth/login" class="subtitle text-[16px]">
          << Back to Login?
        </a>
      </div>
    </form>
  </div>
</div>
